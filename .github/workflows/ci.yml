name: AnimeLab quality checks

on:
  push:
    branches:
      - animelab-drawing-studio-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund esbuild@^0.28.0

      - name: Type-check
        run: npm run lint

      - name: Build website
        run: npm run build
